name: immich  # Stack & directory name
networks:
  immich:
    driver: bridge
services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    volumes:
      - ${APPDATA_LOCATION}/backups:/usr/src/app/upload/backups
      - ${APPDATA_LOCATION}/encoded-video:/usr/src/app/upload/encoded-video
      - ${APPDATA_LOCATION}/profile:/usr/src/app/upload/profile
      - ${APPDATA_LOCATION}/thumbs:/usr/src/app/upload/thumbs
      - /etc/localtime:/etc/localtime:ro
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - ${EXTLIB_LOCATION}:/Albums:ro
    ports:
      - 2283:2283
    environment:
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
    restart: unless-stopped      
    networks:
      - immich
    deploy:
      resources:
        reservations:
          memory: 1GB
          cpus: "0.00"
        limits:
          memory: 4GB
          cpus: "1.00"
    hostname: immich-server
    healthcheck:
      disable: false
    depends_on:
      - redis
      - database
##service
  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:${MACHINE_LEARNING_VERSION}${HARDWARE_ACCELERATION}
    volumes:
      - ${APPDATA_LOCATION}/model-cache:/cache
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
    restart: unless-stopped
    networks:
      - immich
    deploy:
      resources:
        reservations:
          memory: 256MB
          cpus: "0.00"
        limits:
          memory: 4GB
          cpus: "1.00"
    healthcheck:
      disable: false
    hostname: immich-machine-learning
##service
  redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:${REDIS_VERSION}
    volumes: []
    restart: unless-stopped
    networks:
      - immich
    deploy:
      resources:
        reservations:
          memory: 256MB
          cpus: "0.00"
        limits:
          memory: 4GB
          cpus: "1.00"
    hostname: immich-redis
    healthcheck:
      test: redis-cli ping || exit 1
##service
  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:${POSTGRES_VERSION}
    volumes:
      - ${DB_DATA_LOCATION}/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_STORAGE_TYPE: ${DB_STORAGE_TYPE}
      POSTGRES_INITDB_ARGS: --data-checksums
    restart: unless-stopped
    networks:
      - immich
    deploy:
      resources:
        reservations:
          memory: 256MB
          cpus: "0.00"
        limits:
          memory: 4GB
          cpus: "1.00"
    hostname: immich-postgres
##ZimaOS
x-casaos:
  main: immich-server
  port_map: "2283"
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.immich/assets/icon.svg
  title:
    en_US: Immich
    custom: Immich
